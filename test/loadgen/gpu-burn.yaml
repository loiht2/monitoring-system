# Validation load generator. NOT part of the monitoring system — it exists so
# that metrics can be exercised under known conditions. Apply it only while
# running a validation step, and delete it afterwards.
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-burn
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-burn-config
  namespace: gpu-burn
data:
  GPU_BURN_MEMORY: "50%"
  GPU_BURN_DURATION: "600"
  GPU_BURN_DOUBLES: "false"
  GPU_BURN_TENSOR_CORES: "true"     # exercises the tensor pipe fields
  GPU_BURN_LIST_GPUS: "false"
  GPU_BURN_GPU_INDEX: ""
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: burn-a
  namespace: gpu-burn
spec:
  devices:
    requests:
      - name: gpu
        exactly:
          deviceClassName: hami-core-gpu.project-hami.io
          count: 1
          # Both claims must land on the SAME physical card, or this measures
          # two GPUs instead of co-tenancy. Pinned to GPU 0 explicitly because
          # GPU 1 is in MIG mode: HAMi still advertises it as a whole card, and
          # a normal CUDA context on a MIG parent fails with "no CUDA-capable
          # device is detected".
          selectors:
            - cel:
                expression: device.attributes["hami-core-gpu.project-hami.io"].uuid == "GPU-26e02ca7-f4ba-b335-915c-2a8541deb8a4"
          capacity:
            requests:
              cores: "60"
              memory: 8000Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-burn-a
  namespace: gpu-burn
  labels:
    app: gpu-burn
spec:
  restartPolicy: Never
  containers:
    - name: gpu-burn
      image: ghcr.io/loiht2/gpu-burn:cuda13-multi
      envFrom:
        - configMapRef:
            name: gpu-burn-config
      resources:
        claims:
          - name: gpu
  resourceClaims:
    - name: gpu
      resourceClaimName: burn-a
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: burn-b
  namespace: gpu-burn
spec:
  devices:
    requests:
      - name: gpu
        exactly:
          deviceClassName: hami-core-gpu.project-hami.io
          count: 1
          # Both claims must land on the SAME physical card, or this measures
          # two GPUs instead of co-tenancy. Pinned to GPU 0 explicitly because
          # GPU 1 is in MIG mode: HAMi still advertises it as a whole card, and
          # a normal CUDA context on a MIG parent fails with "no CUDA-capable
          # device is detected".
          selectors:
            - cel:
                expression: device.attributes["hami-core-gpu.project-hami.io"].uuid == "GPU-26e02ca7-f4ba-b335-915c-2a8541deb8a4"
          capacity:
            requests:
              cores: "20"          # deliberately one third of burn-a's 60
              memory: 4000Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-burn-b
  namespace: gpu-burn
  labels:
    app: gpu-burn
spec:
  restartPolicy: Never
  containers:
    - name: gpu-burn
      image: ghcr.io/loiht2/gpu-burn:cuda13-multi
      envFrom:
        - configMapRef:
            name: gpu-burn-config
      resources:
        claims:
          - name: gpu
  resourceClaims:
    - name: gpu
      resourceClaimName: burn-b
