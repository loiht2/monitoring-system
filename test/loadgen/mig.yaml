# Validation load for A-8 only: does a saturated MIG instance report utilization
# normalized to the INSTANCE or to the whole card? Delete after measuring.
#
# The instance is 1g.6gb = 14 of the A30's 56 SMs, so the two hypotheses are far
# apart and cannot be confused: ~1.0 means instance-normalized, ~0.25 means
# device-normalized.
apiVersion: v1
kind: Namespace
metadata:
  name: mig-burn
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: burn-mig
  namespace: mig-burn
spec:
  devices:
    requests:
      - name: gpu
        exactly:
          deviceClassName: mig.nvidia.com
          count: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-burn-mig
  namespace: mig-burn
  labels:
    app: gpu-burn-mig
spec:
  restartPolicy: Never
  imagePullSecrets:
    - name: harbor-pull-secret
  containers:
    - name: gpu-burn
      image: docker.io/loihoangthanh1411/gpu-burn:cuda13-multi
      env:
        # Deliberately small: the workload must saturate the instance without
        # the instance's 5.81 GiB being the limiting factor.
        - name: GPU_BURN_MEMORY
          value: "40%"
        - name: GPU_BURN_DURATION
          value: "600"
        - name: GPU_BURN_TENSOR_CORES
          value: "true"
      resources:
        claims:
          - name: gpu
  resourceClaims:
    - name: gpu
      resourceClaimName: burn-mig
