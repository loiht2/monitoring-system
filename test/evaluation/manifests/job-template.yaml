# Job template for one evaluation phase. Filled with envsubst:
#
#   JOB_NAME  IMAGE  MODE  DURATION  DEVICE  DEVICE_CLASS  DEVICE_SELECTOR
#   CAPACITY  (empty except for the HAMi target, where it carries the
#              `capacity.requests` block, already indented)
#
# GPUs on this node are allocated through Dynamic Resource Allocation, NOT the
# device plugin: `kubectl get node a30-node` advertises `nvidia.com/gpu: 0`
# because the card layout (GPU 0 whole, GPU 1 MIG) makes the `single` MIG
# strategy report `NVIDIA-A30-MIG-INVALID`. A Job requesting `nvidia.com/gpu: 1`
# would stay Pending forever. Devices therefore come from a ResourceClaim, the
# same way test/loadgen/gpu-burn.yaml gets them.
#
# Per target class:
#   whole card    DEVICE_CLASS=gpu.nvidia.com, DEVICE_SELECTOR pinned to GPU 0's
#                 uuid
#   MIG instance  DEVICE_CLASS=mig.nvidia.com, DEVICE_SELECTOR pinned to the
#                 instance
#   HAMi-limited  DEVICE_CLASS=hami-core-gpu.project-hami.io, plus a
#                 `capacity.requests` block (cores/memory) inside `exactly:` —
#                 that block is target-specific and belongs to Task 8
#
# No eBPF instrumentation labels are needed on the pod: the agent's
# discovery.instrument matcher selects by namespace glob ("*"), so every pod on
# the node is instrumented. See deploy/40-ebpf-exporter.yaml.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: ${JOB_NAME}
  namespace: default
  labels:
    app: gpu-metric-evaluation
spec:
  devices:
    requests:
      - name: gpu
        exactly:
          allocationMode: ExactCount
          deviceClassName: ${DEVICE_CLASS}
          count: 1
          selectors:
            - cel:
                expression: ${DEVICE_SELECTOR}
${CAPACITY}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: default
  labels:
    app: gpu-metric-evaluation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: gpu-metric-evaluation
        evaluation-mode: "${MODE}"
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: exerciser
          image: ${IMAGE}
          # Always: the exerciser tags are mutable, and a stale cached :v1 on the
          # node silently runs the previous build — which looks like a workload
          # that ran and a metric that did not move.
          imagePullPolicy: Always
          args: ["--mode", "${MODE}", "--duration", "${DURATION}", "--device", "${DEVICE}"]
          resources:
            claims:
              - name: gpu
      resourceClaims:
        - name: gpu
          resourceClaimName: ${JOB_NAME}
