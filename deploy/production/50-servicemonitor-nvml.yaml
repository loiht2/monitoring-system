apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gpu-nvml
  namespace: gpu-monitoring
  labels:
    app.kubernetes.io/part-of: gpu-monitoring   # matched by the Prometheus CR
spec:
  selector:
    matchLabels:
      app: nvml-exporter
  endpoints:
    - port: metrics
      interval: 15s
      honorLabels: true
