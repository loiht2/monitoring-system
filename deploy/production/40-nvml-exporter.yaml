apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvml-exporter
  namespace: gpu-monitoring
spec:
  selector:
    matchLabels:
      app: nvml-exporter
  template:
    metadata:
      labels:
        app: nvml-exporter
    spec:
      serviceAccountName: nvml-exporter
      # MANDATORY. Without it the exporter sees a private PID namespace, every
      # /proc lookup misses, and it emits device metrics normally while
      # silently producing nothing per pod. This is the single most common way
      # to deploy this component broken (docs-internal/04 § 3).
      hostPID: true
      nodeSelector:
        nvidia.com/gpu.present: "true"
      imagePullSecrets:
        - name: REPLACE_WITH_PULL_SECRET
      # The image carries no driver payload, so the container runtime has to
      # inject one. Requesting a GPU resource would do it, but that consumes an
      # allocatable device — and on a DRA-only fleet, where device-plugin
      # capacity is zero, the pod would never schedule at all. The NVIDIA
      # runtime class injects the driver without allocating anything.
      runtimeClassName: nvidia
      containers:
        - name: exporter
          image: REPLACE_ME
          ports:
            - name: metrics
              containerPort: 9401
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Visibility without allocation: the runtime mounts the driver for
            # every card, and `utility` is the capability that carries NVML.
            # Compute and graphics libraries are deliberately not requested —
            # this process reads counters, it never launches work.
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: utility
          # The pod cache is empty until its initial list completes, and until
          # then every PID lookup misses and per-pod series carry blank
          # attribution. Unready pods are excluded from Endpoints, so scraping
          # through the Service keeps Prometheus away during that window.
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            failureThreshold: 3
          # No GPU resource request. The exporter reads host NVML through the
          # driver the container runtime mounts, and on a DRA-only fleet a
          # device-plugin resource request would never schedule.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: proc
              mountPath: /proc
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            # Not read-only: the NVIDIA CDI hook installs the driver by writing
            # symlinks and an ldcache into the container's own filesystem, and
            # fails the container create outright if it cannot. Everything else
            # stays dropped, and nothing here runs as root.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: proc
          hostPath:
            path: /proc
---
apiVersion: v1
kind: Service
metadata:
  name: nvml-exporter
  namespace: gpu-monitoring
  labels:
    app: nvml-exporter
spec:
  selector:
    app: nvml-exporter
  ports:
    - name: metrics
      port: 9401
      targetPort: metrics
