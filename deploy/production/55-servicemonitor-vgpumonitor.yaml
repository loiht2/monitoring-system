# The fourth source: HAMi's own vGPUmonitor, which ships as a container inside
# the HAMi device-plugin pod on the production cluster. It is NOT deployed by
# us — it is scraped where it already exists.
#
# It measures what HAMi *enforces*, which is a different thing from what the
# hardware did (DCGM) or what the driver saw (NVML). Keeping the overlap is
# deliberate: the gap between hami_* and nvml_gpu_memory_used_bytes is an
# enforcement defect, and you can only see it if both are collected.
#
# BEFORE APPLYING, confirm the selector and port against the live cluster:
#   kubectl -n <hami-ns> get svc -l app.kubernetes.io/component=hami-device-plugin -o yaml
# The label set and the metrics port name differ between HAMi chart versions,
# and a ServiceMonitor that matches nothing applies cleanly and scrapes nothing.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gpu-vgpumonitor
  namespace: gpu-monitoring
  labels:
    app.kubernetes.io/part-of: gpu-monitoring
spec:
  namespaceSelector:
    matchNames: ["REPLACE_WITH_HAMI_NAMESPACE"]
  selector:
    matchLabels:
      app.kubernetes.io/component: hami-device-plugin
  endpoints:
    - port: monitorport          # verify: HAMi charts have also used "metrics"
      interval: 15s
      honorLabels: true
      metricRelabelings:
        # Copy, never rename — the same rule as DCGM. vGPUmonitor's native
        # device identifier is `deviceuuid` in some versions and `device_uuid`
        # in others; both are mapped so one manifest covers either, and the
        # original label survives untouched in both cases.
        - sourceLabels: [deviceuuid]
          targetLabel: gpu_uuid
          action: replace
        - sourceLabels: [device_uuid]
          targetLabel: gpu_uuid
          action: replace
