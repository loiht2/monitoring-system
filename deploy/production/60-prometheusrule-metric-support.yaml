            and on() (max(up{job="nvidia-dcgm-exporter"}) == 1)
          labels:
            metric: DCGM_FI_PROF_PIPE_TENSOR_ACTIVE
            source: dcgm
        - record: gpu_metric_supported
          expr: |
            (
              group by (gpu_uuid, GPU_I_ID) (DCGM_FI_PROF_PIPE_TENSOR_HMMA_ACTIVE)
