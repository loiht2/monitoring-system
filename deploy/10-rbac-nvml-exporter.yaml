apiVersion: v1
kind: ServiceAccount
metadata:
  name: nvml-exporter
  namespace: gpu-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nvml-exporter
rules:
  # Read-only, and nothing beyond what the resolver and the allocation
  # collector need. No component in this system writes any object.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims", "resourceslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nvml-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nvml-exporter
subjects:
  - kind: ServiceAccount
    name: nvml-exporter
    namespace: gpu-monitoring
