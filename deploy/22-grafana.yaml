apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: gpu-monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: gpu-prometheus
        uid: gpu-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-operated.gpu-monitoring.svc:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: gpu-monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: gpu-monitoring
        orgId: 1
        folder: GPU
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: gpu-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.6.1
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_USERS_DEFAULT_THEME
              value: "light"
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            # One mount per dashboard ConfigMap: a configMap volume replaces
            # the whole path rather than merging, so a second dashboard added
            # to one mount would hide the first.
            - name: dash-gpu-hardware-device
              mountPath: /var/lib/grafana/dashboards/gpu-hardware-device
            - name: dash-gpu-hardware-mig
              mountPath: /var/lib/grafana/dashboards/gpu-hardware-mig
            - name: dash-gpu-software
              mountPath: /var/lib/grafana/dashboards/gpu-software

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dash-gpu-hardware-device
          configMap:
            name: grafana-dashboard-gpu-hardware-device
            optional: true
        - name: dash-gpu-hardware-mig
          configMap:
            name: grafana-dashboard-gpu-hardware-mig
            optional: true
        - name: dash-gpu-software
          configMap:
            name: grafana-dashboard-gpu-software
            optional: true
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: gpu-monitoring
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
