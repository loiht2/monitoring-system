    {
      "description": "What each pod asks CUDA to do, and where it waits \u2014 entirely eBPF-sourced (kernel launches, memory operations, synchronization, HAMi interception).",
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
