apiVersion: v1
kind: ConfigMap
metadata:
  name: ebpf-gpu-exporter
  namespace: gpu-monitoring
data:
  config.yaml: |
    # Every setting here can produce ZERO GPU metrics with a healthy-looking
    # agent if it is wrong or missing. An unrecognized key is ignored silently.
    ebpf:
      # THE master switch. Without it CUDA tracing is simply off, the agent
      # starts cleanly, /metrics serves the framework's own HTTP and RPC
      # families, and not one ebpf_cuda_* series is ever produced.
      # Quoted deliberately: YAML parses a bare `on` as the boolean true, and
      # the value is parsed as a CudaMode ("on" | "off" | "auto").
      instrument_cuda: 'on'
    attributes:
      kubernetes:
        # Without this the series carry no namespace or pod, so nothing can be
        # attributed to a workload and every per-pod query returns nothing.
        enable: true
    prometheus_export:
      port: 9402
      path: /metrics
      # MUST include the GPU instrumentation. The agent serves its framework's
      # own HTTP/RPC metrics regardless, so the endpoint looks fine either way.
      instrumentations:
        - "*"
    discovery:
      # MUST match the workload containers. A default that matches nothing
      # produces silence, not an error. This is a GLOB, not a regex: "." matches
      # a namespace whose name is one character long, and instruments nothing.
      instrument:
        - k8s_namespace: "*"
    log_level: info
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ebpf-gpu-exporter
  namespace: gpu-monitoring
spec:
  selector:
    matchLabels:
      app: ebpf-gpu-exporter
  template:
    metadata:
      labels:
        app: ebpf-gpu-exporter
    spec:
      serviceAccountName: ebpf-gpu-exporter
      hostPID: true
      # Under hostNetwork the container port IS a host port. 9402 is chosen to
      # avoid the DCGM exporter's conventional port and the NVML exporter's.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: agent
          image: ghcr.io/loiht2/ebpf-gpu-exporter:v1.0.0
          ports:
            - name: metrics
              containerPort: 9402
          env:
            - name: BEYLA_CONFIG_PATH
              value: /config/config.yaml
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true          # BPF program loading and uprobe attachment
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              # 512Mi OOMKilled this agent in under 20s. Instrumenting every
              # namespace means k8s informers over the whole cluster plus eBPF
              # maps and per-process state, and it is killed before it attaches
              # a single uprobe — so the symptom is zero GPU metrics, not an
              # obvious crash.
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: ebpf-gpu-exporter
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ebpf-gpu-exporter
  namespace: gpu-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ebpf-gpu-exporter
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "daemonsets", "statefulsets", "deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ebpf-gpu-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ebpf-gpu-exporter
subjects:
  - kind: ServiceAccount
    name: ebpf-gpu-exporter
    namespace: gpu-monitoring
---
apiVersion: v1
kind: Service
metadata:
  name: ebpf-gpu-exporter
  namespace: gpu-monitoring
  labels:
    app: ebpf-gpu-exporter
spec:
  selector:
    app: ebpf-gpu-exporter
  ports:
    - name: metrics
      port: 9402
      targetPort: 9402
