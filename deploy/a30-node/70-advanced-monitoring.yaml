# Advanced monitoring: a native UI over this system's metrics.
#
# Both Services are NodePort so the UI is reachable from a workstation browser. A
# ClusterIP plus `kubectl port-forward` binds to loopback ON THE NODE, so nothing off the
# node can reach it, and the page renders empty.
#
# THIS EXPOSES AN UNAUTHENTICATED API ON THE NODE ADDRESS. /query proxies ARBITRARY
# PromQL, so anything that can route to 192.168.6.123 can read every metric in the
# cluster. That is acceptable only because this is an isolated validation cluster.
# Keycloak is a prerequisite for ML Platform integration (docs-internal/12 § 5), and this
# manifest must not be copied to a routable network before that lands.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: advanced-monitoring-api
  namespace: gpu-monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: advanced-monitoring-api }
  template:
    metadata:
      labels: { app: advanced-monitoring-api }
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: api
          image: REPLACE_ME_API
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus-operated.gpu-monitoring.svc.cluster.local:9090
            # The UI's origin as the browser sees it. Missing here, every request is
            # blocked by CORS and the page renders empty with no server-side error.
            - name: CORS_ORIGINS
              value: http://192.168.6.123:30802,http://localhost:3002,http://127.0.0.1:3002
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: advanced-monitoring-api
  namespace: gpu-monitoring
spec:
  type: NodePort
  selector: { app: advanced-monitoring-api }
  ports: [{ name: http, port: 8000, targetPort: http, nodePort: 30800 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: advanced-monitoring-ui
  namespace: gpu-monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: advanced-monitoring-ui }
  template:
    metadata:
      labels: { app: advanced-monitoring-ui }
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: ui
          image: REPLACE_ME_UI
          ports: [{ name: http, containerPort: 3002 }]
          env:
            # Read by the BROWSER, not by this pod, so it must be an address the
            # browser can route to — the node's NodePort, not in-cluster DNS.
            - name: MONITORING_API
              value: http://192.168.6.123:30800
          readinessProbe:
            httpGet: { path: /, port: http }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: advanced-monitoring-ui
  namespace: gpu-monitoring
spec:
  type: NodePort
  selector: { app: advanced-monitoring-ui }
  ports: [{ name: http, port: 3002, targetPort: http, nodePort: 30802 }]
