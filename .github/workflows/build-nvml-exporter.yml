name: build-nvml-exporter

on:
  push:
    paths:
      - "exporters/nvml/**"
      - ".github/workflows/build-nvml-exporter.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Vet and test
        run: |
          cd exporters/nvml
          go vet ./...
          go test -race ./...
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: exporters/nvml
          push: true
          # Tag by commit: a manifest must never reference a mutable tag.
          tags: ghcr.io/${{ github.repository_owner }}/nvml-exporter:${{ github.sha }}
