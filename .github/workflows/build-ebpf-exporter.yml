name: build-ebpf-exporter

on:
  push:
    paths:
      - "exporters/ebpf/**"
      - ".github/workflows/build-ebpf-exporter.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Immutable release tag to publish, e.g. v1.0.0. Leave empty for a plain rebuild."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The image's provenance is the submodule pointer pair; without this
          # the build would silently use whatever the default branch holds.
          submodules: recursive
      # The submodule Makefile's image-build target is a multi-platform buildx
      # build (linux/amd64,linux/arm64). The default docker driver cannot do
      # that at all, so without this the build fails before anything is pushed.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ebpf-gpu-exporter
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # The multi-platform build exhausted the runner's disk. Reclaiming the
      # preinstalled toolchains this job never uses buys back roughly 20 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - name: Build and push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          cd exporters/ebpf/eBPF-Lens
          # Generate and vendor once, here on the runner. `make image-build` would
          # do this and then have the Dockerfile repeat it inside the container for
          # every platform -- three generations for a two-platform build, which is
          # what filled the disk.
          make vendor-obi
          # DEV_OBI tells the Dockerfile the OBI tree is already generated and
          # vendored, which is the path its own comment documents for this case.
          #
          # Push straight from buildx rather than tagging afterwards: a
          # multi-platform result never enters the local image store, so a
          # subsequent `docker tag` has nothing to tag. metadata-action emits one
          # tag per line; every tag is an alias of the same build.
          tag_args=""
          while IFS= read -r t; do
            [ -n "$t" ] && tag_args="$tag_args -t $t"
          done <<< "$TAGS"
          # shellcheck disable=SC2086
          docker buildx build --build-arg DEV_OBI=1 \
            --platform linux/amd64,linux/arm64 $tag_args --push .
